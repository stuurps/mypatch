name: Beta update

on:
  push:
    branches: [main]

jobs:
  update:
    name: EAS Update → preview
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          eas-cache: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push OTA update to beta
        env:
          EAS_MESSAGE: ${{ github.event.head_commit.message }}
        run: eas update --branch preview --message "$EAS_MESSAGE" --non-interactive
